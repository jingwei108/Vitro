<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="vitro icon">
  <title>vitro — 方形图标（浅色背景用）</title>
  <!-- light 版：用于浅色背景（液态玻璃深蓝 + 中灰基准线），背景透明 -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- 器壁（玻璃深蓝） -->
    <circle cx="128" cy="128" r="76" stroke="#155E86" stroke-width="14"/>
    <circle cx="128" cy="128" r="69" fill="#155E86" fill-opacity=".06" stroke="none"/>
    <!-- 左上高光弧（完全落在器壁描边带内） -->
    <path d="M62.2 90A76 76 0 0 1 114.8 53.2" stroke="#ffffff" stroke-opacity=".55" stroke-width="6"/>
    <!-- 基准虚线 -->
    <path d="M74 128h108" stroke="#94A3AD" stroke-width="12" stroke-dasharray="16.5 14"/>
  </g>
</svg>
